<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact — Davis King</title>
    <link rel="icon" type="image/png" href="assets/images/icon.png">
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        body {
            background: url('assets/images/background1.jpg') center center/cover no-repeat;
            min-height: 100vh;
            width: 100vw;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .contact-hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
        .contact-card {
            background: linear-gradient(135deg,#1f2937 0%, #111827 100%);
            color: #fff;
            padding: 40px 32px 32px 32px;
            border-radius: 24px;
            max-width: 420px;
            width: 90vw;
            min-width: 320px;
            box-shadow: 0 20px 50px rgba(2,6,23,0.55);
            text-align: left;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .contact-card h1 {
            margin: 0 0 8px 0;
            font-size: 2.1rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            color: #ffe082;
        }
        .contact-card p {
            margin: 0 0 18px 0;
            color: rgba(255,255,255,0.85);
            font-size: 1.1rem;
            text-align: center;
        }
        .contact-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .contact-form label {
            font-weight: 600;
            color: #ffffff;
            font-size: 1rem;
            margin-bottom: 2px;
        }
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #ffffff;
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #232b38;
            color: #fff;
            box-sizing: border-box;
            resize: vertical;
        }
        .contact-form textarea {
            min-height: 100px;
        }
        .contact-form button {
            background: #ffffff;
            color: #1f2937;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            cursor: pointer;
            transition: background 0.18s;
        }
        .contact-form button:hover {
            background: #ffffff;
        }
        @media (max-width: 600px) {
            .contact-card { padding: 20px 6px; }
        }
    </style>
</head>
<body>
    <!-- Toggle Button -->
    <button id="navToggle" class="nav-toggle" aria-label="Open navigation">
        <span class="burger" aria-hidden="true"></span>
    </button>
    <!-- Navigation -->
    <nav class="navigation" id="navigation">
        <a class="Home" href="index.html">Home</a>
        <a class="Projects" href="projects.html">Projects</a>
        <a class="Contact" href="contact.html">Contact</a>
    </nav>
    <main>
        <div class="contact-hero">
            <div class="contact-card">
                <h1>Contact Me</h1>
                <p>Have a question, collaboration, or just want to say hello? Fill out the form below and I'll get back to you soon!</p>
                <form class="contact-form" action="https://formspree.io/f/mnqewqzv" method="POST">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required autocomplete="name">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" required></textarea>
                    <button type="submit">Send Message</button>
                </form>
            </div>
        </div>
    </main>
    <script src="assets/js/script.js"></script>
</body>
</html>
